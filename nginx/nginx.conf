# Nginx = the only public entry point.
#   Browser/Postman -> nginx:80 -> one of the fundoonotes (API) replicas :8080
# The message service is NOT routed here: only the API calls it, over the Docker network.

events {}

http {
    # Docker's internal DNS server. Lets Nginx re-resolve "fundoonotes"
    # when replicas are added/restarted, instead of only once at startup.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream fundoo_api {
        zone fundoo_api 64k;           # shared memory, required for "resolve"
        least_conn;                     # send to the replica with fewest active requests

        # "fundoonotes" = compose service name. With 2 replicas, Docker DNS returns 2 IPs,
        # and Nginx load-balances across all of them.
        server fundoonotes:8080 resolve max_fails=3 fail_timeout=30s;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://fundoo_api;

            # Tell the API who the real client is (Nginx is the one actually connecting)
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # If a replica is down, retry the request on another one
            proxy_next_upstream error timeout http_502 http_503;

            # Debug aid: shows which replica answered. Remove for production.
            add_header X-Upstream $upstream_addr always;
        }
    }
}
