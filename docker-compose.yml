# Run everything:   docker compose up --build
# Open:             http://localhost/swagger   (through Nginx -> 2 API replicas)
# Stop:             docker compose down        (add -v to also delete the database)
#
# Secrets come from a .env file next to this one (copy .env.example to .env).

services:

  postgres:
    image: postgres:16
    container_name: fundoo-postgres
    environment:
      POSTGRES_USER: postgres
      
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: FundooNotes
    ports:
      - "5433:5432"          # 5433 on your Mac so it doesn't clash with anything already on 5432
    volumes:
      - fundoo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d FundooNotes"]
      interval: 5s
      timeout: 5s
      retries: 10

  messageservice:
    build:
      context: .
      dockerfile: MessageService/Dockerfile
    container_name: fundoo-messageservice
    environment:
      ASPNETCORE_ENVIRONMENT: Development      # keeps Swagger on
      Smtp__Host: smtp.gmail.com
      Smtp__Port: "587"
      Smtp__Username: ${SMTP_USERNAME}
      Smtp__Password: ${SMTP_PASSWORD}
      Smtp__FromEmail: ${SMTP_USERNAME}
      Smtp__FromName: Fundoo Notes
    # no "ports:" -> internal only. Only the API calls it, at http://messageservice:8080/

  fundoonotes:
    build:
      context: .
      dockerfile: FundoNotes/Dockerfile
    # no container_name: Docker can't give two replicas the same name
    deploy:
      replicas: 2            # 2 API instances behind Nginx (load balancing)
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__FundooConnection: Host=postgres;Port=5432;Database=FundooNotes;Username=postgres;Password=${POSTGRES_PASSWORD}
      Jwt__Key: ${JWT_KEY}
      MessageService__BaseUrl: http://messageservice:8080/   # container name, not localhost
      Database__MigrateOnStartup: "true"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"   # trust X-Forwarded-For/Proto from Nginx (real client IP)
    # no "ports:" -> only reachable through Nginx
    depends_on:
      postgres:
        condition: service_healthy
      messageservice:
        condition: service_started

  nginx:
    image: nginx:alpine
    container_name: fundoo-nginx
    ports:
      - "80:80"              # http://localhost/swagger  (the only public entry point)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - fundoonotes

volumes:
  fundoo-pgdata:
